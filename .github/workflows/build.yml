name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel (lemonade)
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git gnupg gperf libssl-dev libxml2-utils lzop pngcrush zip zlib1g-dev libelf-dev

      - name: Set up workspace structure
        run: |
          mkdir -p workspace/prebuilts-master/clang/host/linux-x86
          mkdir -p workspace/prebuilts/gcc/linux-x86/aarch64
          mkdir -p workspace/prebuilts/gcc/linux-x86/arm

      - name: Clone AOSP Kernel Build Tools
        run: |
          git clone --depth=1 -b master-kernel-build-2021 https://android.googlesource.com/kernel/build workspace/build

      - name: Clone Clang (r416183b)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b workspace/prebuilts-master/clang/host/linux-x86/clang-r416183b

      - name: Clone GCC 4.9 (AArch64 & Arm32)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 workspace/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 workspace/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          path: workspace/kernel/msm-5.4

      - name: Compile Kernel
        run: |
          cd workspace
          export PATH=$(pwd)/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PATH
          export PATH=$(pwd)/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:$PATH
          export PATH=$(pwd)/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin:$PATH
          BUILD_CONFIG=kernel/msm-5.4/build.config.lemonade VARIANT=qgki LTO=full BUILD_KERNEL=1 build/build.sh

      - name: Package with AnyKernel3
        run: |
          cd workspace
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          # Copy the compiled kernel Image to AnyKernel3 folder
          cp out/msm-5.4-lahaina-qgki/dist/Image AnyKernel3/
          # If dtbo.img is compiled, copy it too
          if [ -f out/msm-5.4-lahaina-qgki/dist/dtbo.img ]; then
            cp out/msm-5.4-lahaina-qgki/dist/dtbo.img AnyKernel3/
          fi
          # Zip the installer package
          cd AnyKernel3
          zip -r9 ../kernel-lemonade-flashable.zip * -x .git* README.md*

      - name: Upload Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Lemonade
          path: workspace/kernel-lemonade-flashable.zip
